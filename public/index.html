<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול הוצאות משפחתיות</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Heebo', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-indigo-600 text-white py-6 shadow-md mb-8">
    <div class="max-w-5xl mx-auto px-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">🏠 ניהול הוצאות משפחתיות</h1>
        <p class="text-indigo-200 text-sm">מעקב נתונים בזמן אמת מחובר ל-Vercel</p>
      </div>
      <button onclick="loadTransactions()" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg transition">
        🔄 רענן נתונים
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 space-y-6">

    <!-- Dashboard Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
        <span class="text-slate-500 text-sm font-medium">סך הכנסות</span>
        <div id="totalIncome" class="text-2xl font-bold text-emerald-600 mt-1">₪0</div>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
        <span class="text-slate-500 text-sm font-medium">סך הוצאות</span>
        <div id="totalExpenses" class="text-2xl font-bold text-rose-600 mt-1">₪0</div>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
        <span class="text-slate-500 text-sm font-medium">יתרה חודשית</span>
        <div id="netBalance" class="text-2xl font-bold text-indigo-600 mt-1">₪0</div>
      </div>
    </div>

    <!-- Form Section -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-lg font-bold mb-4">הוספת תנועה חדשה</h2>
      <form id="transactionForm" onsubmit="handleAddTransaction(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">סוג תנועה</label>
          <select id="type" class="w-full border rounded-lg p-2.5 bg-slate-50 focus:bg-white text-sm" onchange="updateCategories()">
            <option value="expense">הוצאה</option>
            <option value="income">הכנסה</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">תיאור / נושא</label>
          <input type="text" id="title" required placeholder="לדוגמה: קניות בסופר" class="w-full border rounded-lg p-2.5 bg-slate-50 focus:bg-white text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">סכום (₪)</label>
          <input type="number" id="amount" step="0.01" required placeholder="0.00" class="w-full border rounded-lg p-2.5 bg-slate-50 focus:bg-white text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">קטגוריה</label>
          <select id="category" class="w-full border rounded-lg p-2.5 bg-slate-50 focus:bg-white text-sm">
            <!-- מתווסף דינמית -->
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">משלם / מוציא</label>
          <select id="payer" class="w-full border rounded-lg p-2.5 bg-slate-50 focus:bg-white text-sm">
            <option value="משותף">משותף</option>
            <option value="אבא">אבא</option>
            <option value="אמא">אמא</option>
            <option value="אחר">אחר</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">תאריך</label>
          <input type="date" id="date" required class="w-full border rounded-lg p-2.5 bg-slate-50 focus:bg-white text-sm">
        </div>

        <div class="md:col-span-3">
          <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow">
            ➕ הוסף תנועה
          </button>
        </div>
      </form>
    </div>

    <!-- Table Section -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center">
        <h2 class="font-bold text-lg">היסטוריית תנועות</h2>
        <span id="loadingIndicator" class="text-xs text-slate-400 hidden">רענון...</span>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-right text-sm">
          <thead class="bg-slate-50 text-slate-500 font-medium">
            <tr>
              <th class="p-3">תאריך</th>
              <th class="p-3">תיאור</th>
              <th class="p-3">קטגוריה</th>
              <th class="p-3">משלם</th>
              <th class="p-3">סכום</th>
              <th class="p-3 text-center">פעולות</th>
            </tr>
          </thead>
          <tbody id="transactionList" class="divide-y divide-slate-100">
            <!-- נתונים יוכנסו כאן -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const expenseCategories = ['מזון וקניות', 'מגורים וחשבונות', 'תחבורה ורכב', 'חינוך וחוגים', 'בילויים ופנאי', 'בריאות', 'שונות'];
    const incomeCategories = ['משכורת', 'קצבה/מענק', 'השקעות', 'מתנה', 'אחר'];

    let transactions = [];

    // הגדרת תאריך ברירת מחדל להיום
    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    function updateCategories() {
      const type = document.getElementById('type').value;
      const catSelect = document.getElementById('category');
      const list = type === 'expense' ? expenseCategories : incomeCategories;
      catSelect.innerHTML = list.map(c => `<option value="${c}">${c}</option>`).join('');
    }
    updateCategories();

    async function loadTransactions() {
      showLoading(true);
      try {
        const res = await fetch('/api/transactions');
        if (res.ok) {
          transactions = await res.json();
          renderData();
        }
      } catch (err) {
        console.error('שגיאה שטעינת נתונים:', err);
      } finally {
        showLoading(false);
      }
    }

    async function handleAddTransaction(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'שומר...';

      const item = {
        type: document.getElementById('type').value,
        title: document.getElementById('title').value,
        amount: parseFloat(document.getElementById('amount').value),
        category: document.getElementById('category').value,
        payer: document.getElementById('payer').value,
        date: document.getElementById('date').value,
      };

      try {
        const res = await fetch('/api/transactions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(item)
        });

        if (res.ok) {
          document.getElementById('transactionForm').reset();
          document.getElementById('date').value = new Date().toISOString().split('T')[0];
          updateCategories();
          await loadTransactions();
        }
      } catch (err) {
        alert('שגיאה בשמירת התנועה');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '➕ הוסף תנועה';
      }
    }

    async function deleteTransaction(id) {
      if (!confirm('האם אתה בטוח שברצונך למחוק תנועה זו?')) return;

      try {
        const res = await fetch(`/api/transactions?id=${id}`, { method: 'DELETE' });
        if (res.ok) {
          await loadTransactions();
        }
      } catch (err) {
        alert('שגיאה במחיקה');
      }
    }

    function renderData() {
      const tbody = document.getElementById('transactionList');
      tbody.innerHTML = '';

      let totalInc = 0;
      let totalExp = 0;

      if (transactions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">אין תנועות להצגה</td></tr>`;
      } else {
        transactions.forEach(t => {
          const isExpense = t.type === 'expense';
          if (isExpense) totalExp += Number(t.amount);
          else totalInc += Number(t.amount);

          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50 transition';
          tr.innerHTML = `
            <td class="p-3 text-slate-500">${t.date}</td>
            <td class="p-3 font-medium">${t.title}</td>
            <td class="p-3"><span class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full text-xs">${t.category}</span></td>
            <td class="p-3 text-slate-500">${t.payer || '-'}</td>
            <td class="p-3 font-bold ${isExpense ? 'text-rose-600' : 'text-emerald-600'}">
              ${isExpense ? '-' : '+'}${Number(t.amount).toLocaleString('he-IL')} ₪
            </td>
            <td class="p-3 text-center">
              <button onclick="deleteTransaction('${t.id}')" class="text-slate-400 hover:text-rose-600 text-xs transition">🗑️ מחק</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('totalIncome').innerText = `₪${totalInc.toLocaleString('he-IL')}`;
      document.getElementById('totalExpenses').innerText = `₪${totalExp.toLocaleString('he-IL')}`;
      const net = totalInc - totalExp;
      const netEl = document.getElementById('netBalance');
      netEl.innerText = `₪${net.toLocaleString('he-IL')}`;
      netEl.className = `text-2xl font-bold mt-1 ${net >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;
    }

    function showLoading(show) {
      document.getElementById('loadingIndicator').classList.toggle('hidden', !show);
    }

    // טעינה ראשונית
    loadTransactions();
  </script>
</body>
</html>
