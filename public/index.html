<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <title>ניהול הוצאות משפחתיות</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Heebo', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header מינימלי -->
  <header class="bg-white border-b border-slate-200 py-3 shadow-xs mb-6">
    <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
      <h1 class="text-sm font-bold text-slate-700"> TAGA </h1>
      <div class="flex gap-2">
        <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition shadow-xs">
          ➕ הוסף תנועה
        </button>
        <button onclick="loadTransactions()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs px-3 py-1.5 rounded-lg transition">
          🔄 רענן
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 space-y-6">

    <!-- ריבועי סיכום הכנסות/הוצאות (קטנים זה לצד זה עם קו הפרדה נקי) -->
    <div class="bg-white p-3 rounded-xl shadow-xs border border-slate-200 flex justify-around items-center">
      <div class="text-center px-4">
        <span class="text-[11px] text-slate-400 block mb-0.5">סך הכנסות</span>
        <span id="totalIncome" class="text-emerald-600 font-bold text-sm">₪0</span>
      </div>
      <div class="h-6 w-[1px] bg-slate-200"></div>
      <div class="text-center px-4">
        <span class="text-[11px] text-slate-400 block mb-0.5">סך הוצאות</span>
        <span id="totalExpenses" class="text-rose-600 font-bold text-sm">₪0</span>
      </div>
    </div>

    <!-- שורה שנייה: מאזן, ממוצעים וחציוני -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-white p-3 rounded-xl shadow-xs border border-slate-100 text-center">
        <span class="text-[11px] font-medium text-slate-400 block mb-1">מאזן כולל</span>
        <div id="netBalance" class="text-sm font-bold text-slate-800">₪0</div>
      </div>
      <div class="bg-white p-3 rounded-xl shadow-xs border border-slate-100 text-center">
        <span class="text-[11px] font-medium text-slate-400 block mb-1">ממוצע הכנסות</span>
        <div id="avgIncome" class="text-sm font-bold text-emerald-600">₪0</div>
      </div>
      <div class="bg-white p-3 rounded-xl shadow-xs border border-slate-100 text-center">
        <span class="text-[11px] font-medium text-slate-400 block mb-1">ממוצע הוצאות</span>
        <div id="avgExpense" class="text-sm font-bold text-rose-600">₪0</div>
      </div>
      <div class="bg-white p-3 rounded-xl shadow-xs border border-slate-100 text-center">
        <span class="text-[11px] font-medium text-slate-400 block mb-1">חציוני (Median)</span>
        <div id="medianExpense" class="text-sm font-bold text-indigo-600">₪0</div>
      </div>
    </section>

    <!-- הוצאות חריגות -->
    <section class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-center">
      <div class="flex items-center justify-center gap-1.5 mb-1">
        <span class="text-amber-600 text-xs">⚠️</span>
        <h2 class="font-bold text-amber-900 text-xs">הוצאות חריגות (גבוהות פי 1.5+ מהממוצע)</h2>
      </div>
      <div id="unusualExpensesList" class="flex flex-wrap justify-center gap-2 text-xs">
        <span class="text-amber-700 text-xs">אין הוצאות חריגות כרגע.</span>
      </div>
    </section>

    <!-- היסטוריית תנועות וסינון לפי חודשים + ייצוא CSV -->
    <section class="bg-white rounded-2xl shadow-xs border border-slate-100 overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-3">
        <h2 class="font-bold text-sm text-slate-700">היסטוריית תנועות</h2>
        
        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
          <!-- סינון לפי חודש -->
          <select id="monthFilter" onchange="renderData()" class="border border-slate-200 rounded-lg text-xs p-1.5 bg-slate-50 text-slate-600">
            <option value="all">כל החודשים</option>
          </select>

          <!-- כפתור ייצוא ל-CSV -->
          <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg transition shadow-xs flex items-center gap-1">
            📥 ייצוא ל-CSV
          </button>
        </div>

        <span id="loadingIndicator" class="text-xs text-slate-400 hidden">טוען נתונים...</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-right text-xs">
          <thead class="bg-slate-50 text-slate-400 font-medium">
            <tr>
              <th class="p-3">תאריך</th>
              <th class="p-3">תיאור</th>
              <th class="p-3">קטגוריה</th>
              <th class="p-3">סוג</th>
              <th class="p-3">סכום</th>
              <th class="p-3 text-center">פעולות</th>
            </tr>
          </thead>
          <tbody id="transactionList" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- פופ-אפ שלבי הוספת תנועה חדשה (Wizard) -->
  <div id="transactionModal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl relative animate-in fade-in zoom-in duration-150">
      <button onclick="closeAddModal()" class="absolute top-4 left-4 text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
      
      <div id="modalStepContent">
        <!-- התוכן מתחלף דינמית לפי השלב -->
      </div>
    </div>
  </div>

  <script>
    // רשימות קטגוריות ראשוניות (ניתנות לעריכה, הוספה או מחיקה)
    const categoriesData = {
      expense: ['אוכל', 'ביגוד', 'אקססוריז', 'מגורים וחשבונות', 'תחבורה ורכב', 'בילויים ופנאי', 'בריאות', 'שונות'],
      income: ['משכורת', 'קצבה/מענק', 'השקעות', 'מתנה', 'אחר']
    };

    let transactions = [];

    // נתוני הטופס בשלבים
    let currentStep = 1;
    let formData = {
      type: 'expense',
      category: '',
      amount: '',
      title: '',
      date: new Date().toISOString().split('T')[0]
    };

    function openAddModal() {
      currentStep = 1;
      formData = {
        type: 'expense',
        category: categoriesData.expense[0],
        amount: '',
        title: '',
        date: new Date().toISOString().split('T')[0]
      };
      document.getElementById('transactionModal').classList.remove('hidden');
      renderModalStep();
    }

    function closeAddModal() {
      document.getElementById('transactionModal').classList.add('hidden');
    }

    // ניהול מסכי הפופ-אפ בשלבים (Wizard)
    function renderModalStep() {
      const container = document.getElementById('modalStepContent');

      if (currentStep === 1) {
        // שלב 1: בחירת סוג תנועה (הוצאה / הכנסה) - משנה דינמית את הקטגוריות
        container.innerHTML = `
          <h3 class="text-base font-bold text-slate-800 mb-4 text-center">1. בחר סוג תנועה</h3>
          <div class="grid grid-cols-2 gap-3 mb-6">
            <button type="button" onclick="setTransactionType('expense')" class="py-3 rounded-xl border-2 font-medium text-sm transition ${formData.type === 'expense' ? 'border-indigo-600 bg-indigo-50 text-indigo-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}">
              💸 הוצאה
            </button>
            <button type="button" onclick="setTransactionType('income')" class="py-3 rounded-xl border-2 font-medium text-sm transition ${formData.type === 'income' ? 'border-emerald-600 bg-emerald-50 text-emerald-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}">
              💰 הכנסה
            </button>
          </div>
          <button type="button" onclick="nextStep()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-medium text-xs transition shadow-xs">
            הבא ➔
          </button>
        `;
      } 
      else if (currentStep === 2) {
        // שלב 2: בחירת קטגוריה מכפתורים + הוספה/מחיקה/עריכה
        const activeCategories = categoriesData[formData.type];
        let buttonsHtml = activeCategories.map(cat => `
          <div class="flex items-center justify-between bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl transition hover:border-indigo-300">
            <button type="button" onclick="selectCategory('${cat}')" class="flex-1 text-right font-medium text-xs ${formData.category === cat ? 'text-indigo-600 font-bold' : 'text-slate-700'}">
              ${cat} ${formData.category === cat ? ' ✓' : ''}
            </button>
            <button type="button" onclick="deleteCategory('${cat}')" class="text-slate-400 hover:text-rose-600 text-[11px] px-2 transition" title="מחק קטגוריה">🗑️</button>
          </div>
        `).join('');

        container.innerHTML = `
          <h3 class="text-base font-bold text-slate-800 mb-3 text-center">2. בחר קטגוריה</h3>
          <div class="max-h-40 overflow-y-auto space-y-2 mb-3 pl-1">${buttonsHtml}</div>
          
          <div class="flex gap-2 mb-5">
            <input type="text" id="newCategoryInput" placeholder="הוסף קטגוריה חדשה..." class="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-xs bg-slate-50 focus:outline-indigo-500">
            <button type="button" onclick="addNewCategory()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-xl text-xs font-medium transition">הוסף</button>
          </div>

          <div class="flex gap-2">
            <button type="button" onclick="prevStep()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl font-medium text-xs transition">הקודם</button>
            <button type="button" onclick="nextStep()" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-medium text-xs transition">הבא ➔</button>
          </div>
        `;
      }
      else if (currentStep === 3) {
        // שלב 3: סכום התנועה
        container.innerHTML = `
          <h3 class="text-base font-bold text-slate-800 mb-4 text-center">3. הזן סכום</h3>
          <div class="mb-6">
            <input type="number" id="amountInput" step="0.01" value="${formData.amount}" placeholder="0.00" class="w-full border border-slate-200 rounded-xl p-3 text-center text-xl font-bold bg-slate-50 focus:outline-indigo-500">
          </div>
          <div class="flex gap-2">
            <button type="button" onclick="prevStep()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl font-medium text-xs transition">הקודם</button>
            <button type="button" onclick="saveAmountAndNext()" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-medium text-xs transition">הבא ➔</button>
          </div>
        `;
      }
      else if (currentStep === 4) {
        // שלב 4: תיאור (אופציונלי) ותאריך (דיפולט היום) + כפתור שמירה סופית
        container.innerHTML = `
          <h3 class="text-base font-bold text-slate-800 mb-4 text-center">4. פרטים נוספים</h3>
          
          <div class="space-y-3 mb-6">
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">תיאור / נושא (לא חובה)</label>
              <input type="text" id="descInput" value="${formData.title}" placeholder="לדוגמה: קניות בסופר" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs bg-slate-50 focus:outline-indigo-500">
            </div>

            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">תאריך</label>
              <input type="date" id="dateInput" value="${formData.date}" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs bg-slate-50 focus:outline-indigo-500">
            </div>
          </div>

          <div class="flex gap-2">
            <button type="button" onclick="prevStep()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl font-medium text-xs transition">הקודם</button>
            <button type="button" onclick="submitFinalTransaction()" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-xs transition shadow-xs">שמור תנועה ✓</button>
          </div>
        `;
      }
    }

    function setTransactionType(type) {
      formData.type = type;
      // איפוס קטגוריה לבחירה הראשונה ברשימה המתאימה
      formData.category = categoriesData[type][0];
      renderModalStep();
    }

    function selectCategory(cat) {
      formData.category = cat;
      renderModalStep();
    }

    function addNewCategory() {
      const input = document.getElementById('newCategoryInput');
      const val = input.value.trim();
      if (val && !categoriesData[formData.type].includes(val)) {
        categoriesData[formData.type].push(val);
        formData.category = val; // בחר את החדשה אוטומטית
        renderModalStep();
      }
    }

    function deleteCategory(cat) {
      if (categoriesData[formData.type].length <= 1) {
        alert('חייבת להישאר לפחות קטגוריה אחת');
        return;
      }
      categoriesData[formData.type] = categoriesData[formData.type].filter(c => c !== cat);
      if (formData.category === cat) {
        formData.category = categoriesData[formData.type][0];
      }
      renderModalStep();
    }

    function nextStep() {
      if (currentStep === 2 && !formData.category) {
        alert('אנא בחר קטגוריה');
        return;
      }
      currentStep++;
      renderModalStep();
    }

    function prevStep() {
      currentStep--;
      renderModalStep();
    }

    function saveAmountAndNext() {
      const val = document.getElementById('amountInput').value;
      if (!val || Number(val) <= 0) {
        alert('אנא הזן סכום תקין גדול מ-0');
        return;
      }
      formData.amount = parseFloat(val);
      currentStep++;
      renderModalStep();
    }

    async function submitFinalTransaction() {
      formData.title = document.getElementById('descInput').value.trim() || (formData.type === 'expense' ? 'הוצאה כללית' : 'הכנסה כללית');
      formData.date = document.getElementById('dateInput').value;

      const item = {
        type: formData.type,
        title: formData.title,
        amount: formData.amount,
        category: formData.category,
        payer: 'משותף',
        date: formData.date
      };

      try {
        const res = await fetch('/api/transactions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(item)
        });

        if (res.ok) {
          closeAddModal();
          await loadTransactions();
        } else {
          const errData = await res.json();
          alert('שגיאה בשמירת התנועה: ' + (errData.error || ''));
        }
      } catch (err) {
        alert('שגיאה בתקשורת מול השרת בשמירה');
      }
    }

    async function loadTransactions() {
      showLoading(true);
      try {
        const res = await fetch('/api/transactions');
        if (res.ok) {
          transactions = await res.json();
          updateMonthFilterOptions();
          renderData();
        } else {
          alert('שגיאה בטעינת נתונים מהשרת');
        }
      } catch (err) {
        console.error('שגיאה:', err);
      } finally {
        showLoading(false);
      }
    }

    async function deleteTransaction(id) {
      if (!confirm('האם אתה בטוח שברצונך למחוק תנועה זו?')) return;

      try {
        const res = await fetch(`/api/transactions?id=${id}`, { method: 'DELETE' });
        if (res.ok) {
          await loadTransactions();
        } else {
          alert('מחיקה נכשלה');
        }
      } catch (err) {
        alert('שגיאה בתקשורת במחיקה');
      }
    }

    function updateMonthFilterOptions() {
      const filterSelect = document.getElementById('monthFilter');
      const currentSelected = filterSelect.value;
      
      const monthsSet = new Set();
      transactions.forEach(t => {
        if (t.date) {
          const monthStr = t.date.substring(0, 7); // YYYY-MM
          monthsSet.add(monthStr);
        }
      });

      const sortedMonths = Array.from(monthsSet).sort().reverse();
      
      let html = `<option value="all">כל החודשים</option>`;
      sortedMonths.forEach(m => {
        const [year, month] = m.split('-');
        html += `<option value="${m}">${month}/${year}</option>`;
      });

      filterSelect.innerHTML = html;
      if (monthsSet.has(currentSelected) || currentSelected === 'all') {
        filterSelect.value = currentSelected;
      }
    }

    function calculateMedian(arr) {
      if (arr.length === 0) return 0;
      const sorted = [...arr].sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    function renderData() {
      const tbody = document.getElementById('transactionList');
      tbody.innerHTML = '';

      const selectedMonth = document.getElementById('monthFilter').value;
      
      // סינון לפי החודש הנבחר (או הצגת הכל)
      const filteredTransactions = transactions.filter(t => {
        if (selectedMonth === 'all') return true;
        return t.date && t.date.startsWith(selectedMonth);
      });

      let totalInc = 0;
      let totalExp = 0;
      const incomes = [];
      const expenses = [];

      if (!filteredTransactions || filteredTransactions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">אין תנועות להצגה בחודש זה</td></tr>`;
      } else {
        filteredTransactions.forEach(t => {
          const isExpense = t.type === 'expense';
          const amt = Number(t.amount);

          if (isExpense) {
            totalExp += amt;
            expenses.push(amt);
          } else {
            totalInc += amt;
            incomes.push(amt);
          }

          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50 transition';
          tr.innerHTML = `
            <td class="p-3 text-slate-500">${t.date}</td>
            <td class="p-3 font-medium text-slate-700">${t.title}</td>
            <td class="p-3"><span class="bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full text-[11px]">${t.category}</span></td>
            <td class="p-3 text-slate-500">${isExpense ? 'הוצאה' : 'הכנסה'}</td>
            <td class="p-3 font-bold ${isExpense ? 'text-rose-600' : 'text-emerald-600'}">
              ${isExpense ? '-' : '+'}${amt.toLocaleString('he-IL')} ₪
            </td>
            <td class="p-3 text-center">
              <button onclick="deleteTransaction('${t.id}')" class="text-slate-300 hover:text-rose-600 text-xs transition" title="מחק">🗑️</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      const avgIncVal = incomes.length > 0 ? (totalInc / incomes.length) : 0;
      const avgExpVal = expenses.length > 0 ? (totalExp / expenses.length) : 0;
      const medianExpVal = calculateMedian(expenses);
      const net = totalInc - totalExp;

      document.getElementById('totalIncome').innerText = `₪${totalInc.toLocaleString('he-IL')}`;
      document.getElementById('totalExpenses').innerText = `₪${totalExp.toLocaleString('he-IL')}`;
      
      const netEl = document.getElementById('netBalance');
      netEl.innerText = `₪${net.toLocaleString('he-IL')}`;
      netEl.className = `text-sm font-bold ${net >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;

      document.getElementById('avgIncome').innerText = `₪${Math.round(avgIncVal).toLocaleString('he-IL')}`;
      document.getElementById('avgExpense').innerText = `₪${Math.round(avgExpVal).toLocaleString('he-IL')}`;
      document.getElementById('medianExpense').innerText = `₪${Math.round(medianExpVal).toLocaleString('he-IL')}`;

      // חישוב הוצאות חריגות (מעל פי 1.5 מהממוצע)
      const unusualList = document.getElementById('unusualExpensesList');
      unusualList.innerHTML = '';
      const threshold = avgExpVal * 1.5;
      const unusualExpenses = filteredTransactions.filter(t => t.type === 'expense' && Number(t.amount) > threshold && threshold > 0);

      if (unusualExpenses.length === 0) {
        unusualList.innerHTML = `<span class="text-amber-700 text-xs">אין הוצאות חריגות כרגע (מעל פי 1.5 מהממוצע).</span>`;
      } else {
        unusualExpenses.forEach(t => {
          const badge = document.createElement('span');
          badge.className = 'bg-amber-100 text-amber-900 border border-amber-300 px-2.5 py-1 rounded-lg font-medium text-xs inline-flex items-center gap-1';
          badge.innerHTML = `<strong>${t.title}</strong> (${t.date}): ${Number(t.amount).toLocaleString('he-IL')} ₪`;
          unusualList.appendChild(badge);
        });
      }
    }

    // ייצוא מהיר ל-CSV בצד הלקוח (ללא תלויות חיצוניות)
    function exportToCSV() {
      const selectedMonth = document.getElementById('monthFilter').value;
      const dataToExport = transactions.filter(t => {
        if (selectedMonth === 'all') return true;
        return t.date && t.date.startsWith(selectedMonth);
      });

      if (!dataToExport || dataToExport.length === 0) {
        alert('אין נתונים לייצוא');
        return;
      }

      // הוספת BOM לתיקון קידוד עברית בתוכנת Excel
      let csvContent = "\uFEFFתאריך,תיאור,קטגוריה,סוג,סכום\n";

      dataToExport.forEach(t => {
        const typeStr = t.type === 'expense' ? 'הוצאה' : 'הכנסה';
        const row = [
          t.date,
          `"${(t.title || '').replace(/"/g, '""')}"`,
          `"${(t.category || '').replace(/"/g, '""')}"`,
          typeStr,
          t.amount
        ].join(",");
        csvContent += row + "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `family_expenses_${selectedMonth}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function showLoading(show) {
      document.getElementById('loadingIndicator').classList.toggle('hidden', !show);
    }

    // טעינת הנתונים הראשונית בעליית העמוד
    loadTransactions();
  </script>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Service Worker registered:', reg.scope))
          .catch((err) => console.log('Service Worker error:', err));
      });
    }
  </script>
</body>
</html>
